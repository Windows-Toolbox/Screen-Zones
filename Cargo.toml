[package]
name = "screen-zones"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "Puts games and programs borderless into a fixed area of the screen and keeps them there – one entry per game, applied every time it starts."
repository = "https://github.com/Windows-Toolbox/Screen-Zones"

# What the Toolbox needs to know; program.json is generated from this by build.rs (Toolbox\DESIGN.md 15.4).
[package.metadata.toolbox]
id = "screen_zones"
exe = "ScreenZones.exe"
category = { de = "Allgemein", en = "General" }
background = true
name = "Screen Zones"
description = { de = "Setzt Spiele und Programme rahmenlos in einen festen Bereich des Bildschirms und hält sie dort – ein Eintrag pro Spiel, bei jedem Start von selbst. Der Nachfolger des Rayman-Legends-Skripts.", en = "Puts games and programs borderless into a fixed area of the screen and keeps them there – one entry per game, applied every time it starts. The successor of the Rayman Legends script." }

[dependencies]
# The shared library of the Windows Toolbox, compiled in (from its main branch).
kit = { package = "toolbox-kit", git = "https://github.com/Windows-Toolbox/Toolbox" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
kit = { package = "toolbox-kit", git = "https://github.com/Windows-Toolbox/Toolbox", default-features = false, features = ["build"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
